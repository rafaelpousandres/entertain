# Codemagic CI — Entertain (Spec 035, Block B).
#
# One workflow: build the signed iOS app and upload it to App Store Connect
# (TestFlight). MANUAL start only — there is deliberately no `triggering:`
# section, so no push, PR or tag ever starts a build.
#
# No secret lives in this file. Everything sensitive is configured in the
# Codemagic UI and referenced here BY NAME only:
#   - integration  `entertain_asc`          App Store Connect API key
#   - group        `entertain_ios_signing`  CERTIFICATE_PRIVATE_KEY
#   - group        `entertain_app`          SUPABASE_URL, SUPABASE_ANON_KEY
# Setup steps: see the Spec 035 Block B report.

workflows:
  ios-testflight:
    name: iOS — TestFlight (manual)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Exposes APP_STORE_CONNECT_ISSUER_ID / _KEY_IDENTIFIER / _PRIVATE_KEY to
      # the build, used both for code signing and for the upload.
      app_store_connect: entertain_asc

    environment:
      # Pinned on purpose (never "stable"): plugin integration mode (Swift
      # Package Manager vs CocoaPods) depends on the Flutter version, and the
      # iOS project was generated and analysed with exactly this one.
      flutter: 3.44.6
      xcode: latest
      cocoapods: default
      groups:
        - entertain_ios_signing
        - entertain_app
      vars:
        BUNDLE_ID: "com.pous.entertain"
        # permission_handler, when integrated through Swift Package Manager,
        # enables each permission from the Info.plist usage keys unless an
        # environment variable says otherwise. The app never requests photo
        # library or notification permission, so both are compiled out.
        PERMISSION_PHOTOS: "0"
        PERMISSION_NOTIFICATIONS: "0"

    scripts:
      - name: Check toolchain and required configuration
        script: |
          set -e
          flutter --version
          flutter --version | grep -q "Flutter 3.44.6" || {
            echo "ERROR: expected Flutter 3.44.6"; exit 1;
          }
          # Fail closed: without these the app builds but cannot reach its
          # backend, and nothing else would flag it.
          for name in SUPABASE_URL SUPABASE_ANON_KEY CERTIFICATE_PRIVATE_KEY \
                      APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
                      APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "ERROR: required variable $name is not set"; exit 1
            fi
          done
          echo "Required variables are present."

      - name: Make the permission switches visible to Xcode
        script: |
          # The build inherits them from the environment already; launchctl
          # also covers any Xcode helper process that does not.
          launchctl setenv PERMISSION_PHOTOS "$PERMISSION_PHOTOS"
          launchctl setenv PERMISSION_NOTIFICATIONS "$PERMISSION_NOTIFICATIONS"
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up code signing (automatic, via the App Store Connect API key)
        script: |
          set -e
          keychain initialize
          # Fetches the App Store certificate and provisioning profile for the
          # bundle id, creating them when they do not exist yet.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build the signed IPA
        script: |
          set -e
          # iOS build number = Codemagic's project build counter, independent
          # of Android's versionCode. The version name comes from pubspec.yaml.
          # Pods are installed and Swift packages resolved by this command.
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      # Lock files generated by the build, to be committed to the repo so
      # later builds resolve the same native dependency versions.
      - ios/Podfile.lock
      - ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Not sent to external beta review, never to App Store
        # review: nothing reaches the public from this workflow.
        submit_to_testflight: false
        submit_to_app_store: false
